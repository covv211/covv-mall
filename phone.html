<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 보안(CSP): privacy.html 규칙 + 이 페이지 스크립트(phone.js) + 같은 사이트 화면(covv.html)을 휴대폰 틀 안에 띄우는 frame-src -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; frame-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴대폰 미리보기 · 코브 몰</title>
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" integrity="sha384-uR1wgObmx89ZQ4VVXHdzjbDJZ1PvBK01K+E3GebmaBKdZ87qRJvBWPoPbzWeEd5T" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="default.css?v=1110y">
    <link rel="stylesheet" href="style.css?v=1110y">
</head>
<body class="ph">
    <!-- 휴대폰 미리보기: 휴대폰이 없을 때 PC에서 코브 몰을 휴대폰 크기 틀 안에 띄워 봄 (주인님 확인용 — 검색엔진엔 안 올림)
         틀 크기 · 가로세로 · 화면은 phone.js가 바꿈. 폭에 따른 배치는 휴대폰과 같지만, 손가락 전용(pointer: coarse) 크기 · 휴대폰용 가벼운 들판 설정은 실제 휴대폰이나 크롬 휴대폰 보기에서만 -->
    <main class="ph-page">
        <section class="ph-side" aria-label="미리보기 설정">
            <a class="back" href="covv.html"><span class="ico-arrow left" aria-hidden="true"></span>코브 몰로</a>
            <div class="section-head">
                <p class="eyebrow">PHONE PREVIEW</p>
                <h2>휴대폰 미리보기</h2>
            </div>
            <div class="ph-group" role="group" aria-labelledby="phDevLabel">
                <p class="ph-label" id="phDevLabel">기종</p>
                <div class="ph-pills" data-ph-devices></div>
            </div>
            <div class="ph-group" role="group" aria-labelledby="phScrLabel">
                <p class="ph-label" id="phScrLabel">화면</p>
                <div class="ph-pills" data-ph-screens></div>
            </div>
            <div class="ph-group">
                <p class="ph-label">보기</p>
                <div class="ph-pills">
                    <button type="button" class="ph-pill" data-ph-rotate aria-pressed="false">가로로 돌리기</button>
                    <button type="button" class="ph-pill" data-ph-reload>새로고침</button>
                </div>
            </div>
            <p class="ph-size" data-ph-size></p>
            <div class="ph-note">
                <p>폭에 따라 바뀌는 화면 배치는 휴대폰과 같아요. 휴대폰 틀 안에서도 누르고 끌고 스크롤할 수 있어요.</p>
                <p>손가락 전용 크기(44px 단추)와 휴대폰용 가벼운 들판 설정은 실제 휴대폰이나 크롬 휴대폰 보기에서만 보여요 — 크롬에서 <b>F12</b> → <b>Ctrl+Shift+M</b>(맥은 ⌘+Shift+M) → 위에서 기종 고르기 → <b>F5</b>(새로고침)</p>
            </div>
        </section>
        <!-- 휴대폰 틀: 노치 · 둥근 모서리 · 화면(iframe) — 창이 낮으면 phone.js가 틀째 줄여서 다 보이게 -->
        <div class="ph-stage" data-ph-stage>
            <div class="ph-device" data-ph-device>
                <iframe class="ph-screen" data-ph-frame title="휴대폰 화면 미리보기" src="covv.html"></iframe>
            </div>
        </div>
    </main>
    <script src="phone.js?v=1110y"></script>
</body>
</html>
